<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub 仓库体检工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body class="min-h-screen bg-[radial-gradient(circle_at_top_left,#dbeafe,transparent_32%),linear-gradient(135deg,#f8fafc_0%,#eef2ff_100%)] text-slate-900">
    <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-10 sm:px-6 lg:px-8">
      <header class="mb-10 text-center">
        <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-900 text-xl font-black text-white shadow-lg shadow-slate-300">
          GH
        </div>
        <h1 class="text-4xl font-bold tracking-tight text-slate-950 sm:text-5xl">GitHub 仓库体检工具</h1>
        <p class="mx-auto mt-4 max-w-2xl text-base leading-7 text-slate-600 sm:text-lg">
          输入一个公开的 GitHub 仓库链接，快速查看核心指标与编程语言分布。
        </p>
      </header>

      <section class="mx-auto mb-10 w-full max-w-3xl rounded-[2rem] border border-white/70 bg-white/85 p-4 shadow-2xl shadow-slate-300/40 backdrop-blur sm:p-6">
        <form id="repoForm" class="flex flex-col gap-3 sm:flex-row">
          <label for="repoUrl" class="sr-only">GitHub 仓库链接</label>
          <div class="relative flex-1">
            <span class="pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M10.5 13.5 13.5 10.5M8.5 15.5 6.8 17.2a3.4 3.4 0 0 1-4.8-4.8l3.1-3.1a3.4 3.4 0 0 1 4.8 0M15.5 8.5l1.7-1.7a3.4 3.4 0 0 1 4.8 4.8l-3.1 3.1a3.4 3.4 0 0 1-4.8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <input
              id="repoUrl"
              type="url"
              required
              placeholder="请输入公开的 GitHub 仓库链接"
              class="min-h-14 w-full rounded-2xl border border-slate-200 bg-slate-50/80 py-3 pl-12 pr-5 text-base text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"
            />
          </div>
          <button
            id="checkBtn"
            type="submit"
            class="inline-flex min-h-14 items-center justify-center gap-2 rounded-2xl bg-slate-950 px-8 font-semibold text-white shadow-lg shadow-slate-300 transition hover:-translate-y-0.5 hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-300 disabled:translate-y-0 disabled:cursor-not-allowed disabled:bg-slate-400"
          >
            <span id="btnSpinner" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
            <span id="btnText">开始体检</span>
          </button>
        </form>
      </section>

      <section id="resultPanel" class="hidden grid gap-6 lg:grid-cols-5">
        <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70 lg:col-span-2">
          <div class="mb-6 border-b border-slate-100 pb-5">
            <p class="text-sm font-medium text-slate-500">当前仓库</p>
            <a id="repoName" href="#" target="_blank" rel="noreferrer" class="mt-2 block break-all text-2xl font-bold text-slate-950 hover:text-blue-600"></a>
            <p id="repoDesc" class="mt-3 text-sm leading-6 text-slate-600"></p>
          </div>

          <div class="grid gap-4 sm:grid-cols-3 lg:grid-cols-1">
            <article class="rounded-2xl border border-amber-100 bg-amber-50 p-5">
              <p class="text-sm font-medium text-amber-700">Star 数</p>
              <p id="starsCount" class="mt-2 text-3xl font-bold text-amber-950">0</p>
            </article>
            <article class="rounded-2xl border border-blue-100 bg-blue-50 p-5">
              <p class="text-sm font-medium text-blue-700">Fork 数</p>
              <p id="forksCount" class="mt-2 text-3xl font-bold text-blue-950">0</p>
            </article>
            <article class="rounded-2xl border border-rose-100 bg-rose-50 p-5">
              <p class="text-sm font-medium text-rose-700">Open Issues 数</p>
              <p id="issuesCount" class="mt-2 text-3xl font-bold text-rose-950">0</p>
            </article>
          </div>

          <div class="mt-6 rounded-2xl border border-emerald-100 bg-gradient-to-br from-emerald-50 to-teal-50 p-5">
            <div class="flex items-start justify-between gap-4">
              <div>
                <p class="text-sm font-medium text-emerald-700">AI 综合评分</p>
                <p class="mt-2 text-4xl font-black text-emerald-950"><span id="aiScore">--</span><span class="text-xl font-bold text-emerald-700">/100</span></p>
              </div>
              <span class="rounded-full bg-white/80 px-3 py-1 text-xs font-semibold text-emerald-700 shadow-sm">AI Review</span>
            </div>
            <div class="mt-4 border-t border-emerald-100 pt-4">
              <p class="text-sm font-medium text-emerald-800">健康度分析</p>
              <p id="aiReview" class="mt-2 whitespace-pre-line text-sm leading-6 text-slate-700">暂无 AI 分析。</p>
            </div>
          </div>
        </div>

        <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70 lg:col-span-3">
          <div class="mb-4 flex flex-col justify-between gap-3 sm:flex-row sm:items-center">
            <div>
              <h2 class="text-xl font-bold text-slate-950">编程语言分布</h2>
              <p class="mt-1 text-sm text-slate-500">基于 GitHub Languages API 返回的代码字节数统计</p>
            </div>
            <span id="mainLanguage" class="w-fit rounded-full bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700">暂无数据</span>
          </div>
          <div id="languageChart" class="h-[360px] w-full sm:h-[430px]"></div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById('repoForm');
      const repoUrlInput = document.getElementById('repoUrl');
      const checkBtn = document.getElementById('checkBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');
      const resultPanel = document.getElementById('resultPanel');
      const repoName = document.getElementById('repoName');
      const repoDesc = document.getElementById('repoDesc');
      const starsCount = document.getElementById('starsCount');
      const forksCount = document.getElementById('forksCount');
      const issuesCount = document.getElementById('issuesCount');
      const aiScore = document.getElementById('aiScore');
      const aiReview = document.getElementById('aiReview');
      const mainLanguage = document.getElementById('mainLanguage');
      const chartDom = document.getElementById('languageChart');
      let languageChart = null;

      function formatNumber(value) {
        return new Intl.NumberFormat('zh-CN').format(value || 0);
      }

      function setLoading(isLoading) {
        checkBtn.disabled = isLoading;
        btnSpinner.classList.toggle('hidden', !isLoading);
        btnText.textContent = isLoading ? '体检中...' : '开始体检';
      }

      function getErrorMessage(data) {
        if (!data) return '查询失败，请检查仓库链接后重试';
        if (typeof data.detail === 'string') return data.detail;
        if (Array.isArray(data.detail)) return data.detail.map((item) => item.msg || item.message || '参数错误').join('\n');
        return data.message || '查询失败，请检查仓库链接后重试';
      }

      function renderMetrics(data) {
        repoName.textContent = data.full_name || data.name || '未知仓库';
        repoName.href = data.html_url || '#';
        repoDesc.textContent = data.description || '该仓库暂无描述。';
        starsCount.textContent = formatNumber(data.stars);
        forksCount.textContent = formatNumber(data.forks);
        issuesCount.textContent = formatNumber(data.open_issues);
        aiScore.textContent = data.ai?.score ?? '--';
        aiReview.textContent = data.ai?.review || 'AI 评分暂不可用，基础仓库数据已正常返回。';
        mainLanguage.textContent = data.language ? `主语言：${data.language}` : '暂无主语言';
      }

      function renderLanguageChart(languages) {
        const chartData = Object.entries(languages || {})
          .filter(([, value]) => Number(value) > 0)
          .sort((a, b) => b[1] - a[1])
          .map(([name, value]) => ({ name, value }));

        if (!languageChart) {
          languageChart = echarts.init(chartDom);
        }

        languageChart.setOption(
          {
            color: ['#2563eb', '#7c3aed', '#f59e0b', '#10b981', '#ef4444', '#06b6d4', '#64748b', '#ec4899'],
            tooltip: {
              trigger: 'item',
              formatter: '{b}<br />{c} bytes ({d}%)',
            },
            legend: {
              bottom: 0,
              type: 'scroll',
              textStyle: {
                color: '#475569',
              },
            },
            series: [
              {
                name: '语言分布',
                type: 'pie',
                radius: ['42%', '70%'],
                center: ['50%', '45%'],
                avoidLabelOverlap: true,
                stillShowZeroSum: false,
                itemStyle: {
                  borderRadius: 10,
                  borderColor: '#ffffff',
                  borderWidth: 3,
                },
                label: {
                  color: '#334155',
                  formatter: '{b}\n{d}%',
                },
                emphasis: {
                  label: {
                    show: true,
                    fontSize: 18,
                    fontWeight: 700,
                  },
                },
                data: chartData.length ? chartData : [{ name: '暂无语言数据', value: 0 }],
              },
            ],
          },
          true,
        );
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const repoUrl = repoUrlInput.value.trim();
        if (!repoUrl) {
          alert('请输入公开的 GitHub 仓库链接');
          return;
        }

        setLoading(true);

        try {
          const response = await fetch('/api/check', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ repo_url: repoUrl }),
          });

          let data = null;
          try {
            data = await response.json();
          } catch (_) {
            data = null;
          }

          if (!response.ok) {
            throw new Error(getErrorMessage(data));
          }

          renderMetrics(data);
          renderLanguageChart(data.languages);
          resultPanel.classList.remove('hidden');
          resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setTimeout(() => languageChart.resize(), 0);
        } catch (error) {
          resultPanel.classList.add('hidden');
          alert(error.message || '请求失败，请稍后重试');
        } finally {
          setLoading(false);
        }
      });

      window.addEventListener('resize', () => {
        if (languageChart) {
          languageChart.resize();
        }
      });
    </script>
  </body>
</html>
